name: One-time static CSS compiler (review branch only)

# Creates the precompiled CSS only on the dedicated review branch.
# Never publishes or deploys any app or website.
on:
  push:
    branches:
      - fix/security-gameplay-review-20261117
    paths:
      - tools/build-static-css.cjs
      - tools/tailwind-candidates.txt

permissions:
  contents: write

jobs:
  generate:
    if: github.ref == 'refs/heads/fix/security-gameplay-review-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout review branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install pinned Tailwind compiler (no lifecycle scripts)
        run: npm install --no-save --ignore-scripts --no-audit --no-fund tailwindcss@4.1.10
      - name: Generate static CSS
        run: node tools/build-static-css.cjs
      - name: Save generated CSS to review branch (no deploy)
        run: |
          git add css/tailwind-static.css
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: add precompiled Tailwind CSS to review branch [skip ci]"
            git push origin HEAD:refs/heads/fix/security-gameplay-review-20261117
          fi
