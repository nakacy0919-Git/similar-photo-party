name: iPad and mobile browser viewport checks

on:
  pull_request:
    paths:
      - "css/photo-flow.css"
      - "css/immersive.css"
      - "css/charades.css"
      - "index.html"
      - "charades.html"
      - "tests/ipad-viewport-browser.cjs"
      - ".github/workflows/tablet-browser-checks.yml"

permissions:
  contents: read

jobs:
  viewport:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install Chromium browser automation
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify iPad portrait/landscape and iPhone layouts
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/tablet-preview-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node tests/ipad-viewport-browser.cjs
      - name: Keep viewport screenshots for visual QA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ipad-iphone-layout-screenshots
          path: artifacts/ipad-layout/*.png
          if-no-files-found: ignore
          retention-days: 7
